# dsh-automation-monitor —— bundle patch
#
# 把本插件插进 profile 的配置树。
# 安装：dsh plugin --profile desktop add link:<本目录绝对路径>
#   （或手工：把本目录放进 <profile>/node_modules/，并在 package.json 的
#     dependencies 与 dsh.profile.bundles 里各加一行 dsh-automation-monitor）

- insert:
    - id: automation-monitor
      name: dsh-automation-monitor
